<text x="16" y="287" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">Now let&#x27;s run the tests to confirm everything passes:                                           </text>
<text x="16" y="327" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">● </text>
<text x="32.8" y="327" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" font-weight="700">shell</text>
<text x="74.8" y="327" textLength="747.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> cd /home/me/stats &amp;&amp; python -m pytest tests/test_stats.py -v                            </text>
<text x="16" y="347" textLength="436.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" fill-opacity="0.55">  ⎿ exit 1 · /usr/bin/python: No module named pytest</text>
