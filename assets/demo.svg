<text x="32.8" y="347" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">read</text>
<text x="66.4" y="347" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> — Read a text file (up to 2000 lines, with offset/limit).</text>
<text x="16" y="367" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">• </text>
<text x="32.8" y="367" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">list</text>
<text x="66.4" y="367" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> — List a directory; directories end with </text>
<text x="419.2" y="367" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">/</text>
<text x="427.6" y="367" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">.</text>
<text x="16" y="387" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">• </text>
<text x="32.8" y="387" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">find</text>
<text x="66.4" y="387" textLength="336" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> — Find files by glob pattern, skipping </text>
<text x="402.4" y="387" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">.gitignore</text>
<text x="486.4" y="387" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">-d entries.</text>
<text x="16" y="407" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">• </text>
<text x="32.8" y="407" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">search</text>
<text x="83.2" y="407" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> — Search file contents with a regex; returns </text>
<text x="469.6" y="407" textLength="126" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">path:line: text</text>
<text x="595.6" y="407" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">.</text>
<text x="16" y="427" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">• </text>
<text x="32.8" y="427" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">write</text>
<text x="74.8" y="427" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> — Write a whole file, creating parent directories as needed.</text>
