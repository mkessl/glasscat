<text x="16" y="227" textLength="747.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" fill-opacity="0.55">  //! The model&#x27;s tools. Each takes JSON arguments and returns text for the  (+881 lines)</text>
<text x="16" y="267" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" fill-opacity="0.55">thought · 13 lines · ctrl+o shows</text>
<text x="16" y="307" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">Based on </text>
