<text x="16" y="407" textLength="310.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" fill-opacity="0.55">  ⎿ exit 5 · NO TESTS RAN  (+4 lines)</text>
<text x="16" y="447" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">● </text>
<text x="32.8" y="447" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" font-weight="700">shell</text>
<text x="74.8" y="447" textLength="747.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> cd /home/me/stats &amp;&amp; python -c &quot; …                                                      </text>
<text x="16" y="467" textLength="210" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" fill-opacity="0.55">  ⎿ ok · All tests passed</text>
<text x="16" y="507" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">Both tests pass. Here&#x27;s a summary of what was fixed:                                            </text>
<text x="16" y="547" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">1. </text>
<text x="41.2" y="547" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">mean</text>
<text x="74.8" y="547" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">: Removed the spurious </text>
<text x="268" y="547" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">- 1</text>
<text x="293.2" y="547" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> that caused an off-by-one error. The mean of </text>
<text x="679.6" y="547" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">[1,2,3]</text>
<text x="738.4" y="547" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> is now   </text>
<text x="16" y="567" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">   correctly </text>
<text x="125.2" y="567" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">2</text>
<text x="133.6" y="567" textLength="688.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">.                                                                                 </text>
<text x="16" y="607" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">2. </text>
<text x="41.2" y="607" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">median</text>
<text x="91.6" y="607" textLength="730.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">: For even-length lists, the median is the average of the two middle values. The old   </text>
<text x="16" y="627" textLength="546" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">   code just took the single middle element (the upper one, e.g. </text>
<text x="562" y="627" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">3</text>
<text x="570.4" y="627" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> for </text>
<text x="612.4" y="627" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">[1,2,3,4]</text>
<text x="688" y="627" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">). The fix      </text>
<text x="16" y="647" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">   checks </text>
<text x="100" y="647" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">n % 2 == 0</text>
<text x="184" y="647" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> and averages the two middle elements (</text>
<text x="511.6" y="647" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">s[n//2 - 1]</text>
<text x="604" y="647" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3"> and </text>
<text x="646" y="647" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#56d364">s[n//2]</text>
<text x="704.8" y="647" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">), falling    </text>
<text x="16" y="667" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3">   back to the middle element for odd-length lists.                                             </text>
<text x="16" y="687" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e6edf3" fill-opacity="0.55">────────────────────────────────────────────────────────────────────────────────────────────────</text>
