[package]
name = "agent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The program's name lives here and nowhere else in the code.
[[bin]]
name = "glasscat"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
